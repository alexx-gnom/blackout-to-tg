
name: Parse DTEK Fact Schedule

on:
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest

    steps:
      - name: Parse actual schedule
        run: |
          python - <<'PY'
          import json
          import re
          import html
          import urllib.request
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          url = "https://www.dtek-krem.com.ua/ua/shutdowns"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as r:
              page = r.read().decode("utf-8", errors="replace")

          page = html.unescape(page)

          marker = "DisconSchedule.fact"
          pos = page.find(marker)

          if pos < 0:
              raise RuntimeError("DisconSchedule.fact not found")

          eq = page.find("=", pos + len(marker))
          if eq < 0:
              raise RuntimeError("Assignment '=' not found")

          start = eq + 1
          while start < len(page) and page[start].isspace():
              start += 1

          decoder = json.JSONDecoder()
          fact, end = decoder.raw_decode(page[start:])

          print("Fact keys:", list(fact.keys()))
          print("Update fact:",
                re.search(r'DisconSchedule\.updateFact\s*=\s*["\']([^"\']+)',
                          page).group(1)
                if re.search(r'DisconSchedule\.updateFact\s*=\s*["\']([^"\']+)',
                             page) else "not found")

          data = fact.get("data", {})
          kyiv = ZoneInfo("Europe/Kyiv")
          today = datetime.now(kyiv).date()

          print("Kyiv today:", today)
          found_today = False

          for timestamp, groups in data.items():
              try:
                  date = datetime.fromtimestamp(
                      int(timestamp), timezone.utc
                  ).astimezone(kyiv).date()
              except (ValueError, OSError):
                  continue

              if date != today:
                  continue

              found_today = True
              print("Date key:", timestamp, "local date:", date)

              group = groups.get("GPV6.1")
              if group is None:
                  print("GPV6.1 not found for this date")
              else:
                  print("GPV6.1:")
                  print(json.dumps(group, ensure_ascii=False,
                                   indent=2))

          if not found_today:
              print("No fact entry found for today's Kyiv date.")
              print("Available dates:")
              for timestamp in data:
                  try:
                      date = datetime.fromtimestamp(
                          int(timestamp), timezone.utc
                      ).astimezone(kyiv).date()
                      print(timestamp, date)
                  except (ValueError, OSError):
                      pass
          PY
