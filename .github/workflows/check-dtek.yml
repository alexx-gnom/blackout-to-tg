
name: Check DTEK

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check mirror data
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = "https://raw.githubusercontent.com/Baskerville42/outage-data-ua/main/data/kyiv-region.json"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "BlackoutToTg/1.0"}
          )

          with urllib.request.urlopen(req, timeout=20) as response:
              data = json.load(response)

          print("Region:", data.get("regionAffiliation"))
          print("Last fetched:", data.get("lastUpdated"))
          print("Fetch status:", json.dumps(
              data.get("lastUpdateStatus"),
              ensure_ascii=False
          ))

          fact = data.get("fact", {})
          print("Fact updated:", fact.get("updateFact") or fact.get("update"))

          for section_name in ("fact", "preset"):
              section = data.get(section_name, {})
              print(f"\n{section_name} GPV6.1:")
              print(json.dumps(
                  section.get("data", {}).get("GPV6.1"),
                  ensure_ascii=False
              ))
          PY
