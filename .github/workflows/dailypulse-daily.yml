name: DailyPulse daily content

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'
      timezone: 'Europe/Kyiv'
    - cron: '15 5 * * *'
      timezone: 'Europe/Kyiv'

permissions:
  contents: write

concurrency:
  group: dailypulse-daily-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate today's content
        run: python dailypulse_calendar/generate_daily.py --check-images
      - name: Commit and push just the daily output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dailypulse_calendar/daily.json
          if git diff --cached --quiet; then
            echo "Content already up to date."
            exit 0
          fi
          git commit -m "DailyPulse: generate $(TZ=Europe/Kyiv date +%F)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race with another workflow; retry $attempt"
            sleep 5
          done
          echo "Push failed after retries" >&2
          exit 1
